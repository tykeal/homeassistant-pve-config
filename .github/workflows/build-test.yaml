---
# SPDX-FileCopyrightText: 2026 Andrew Grimberg <tykeal@bardicgrove.org>
# SPDX-License-Identifier: Apache-2.0

name: 'Build/Test'

# yamllint disable-line rule:truthy
on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: ['main']
  push:
    branches: ['main']
  workflow_dispatch:

permissions: {}

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  bats:
    name: 'Bats Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: 'Harden the runner'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2  # v2.22.2
        with:
          egress-policy: 'audit'

      - name: 'Checkout repository'
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # tests/ does not necessarily exist yet. Running bats over a missing
      # or empty directory would fail the build for no good reason, so
      # detect the suite first and say plainly when there is nothing to do.
      - name: 'Detect bats test suite'
        id: detect
        run: |
          if [ -d tests ] && \
             find tests -type f -name '*.bats' -print -quit | grep -q .; then
            echo 'found=true' >> "$GITHUB_OUTPUT"
            echo 'Found bats tests under tests/; running them.' \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'found=false' >> "$GITHUB_OUTPUT"
            echo 'No bats tests found under tests/; nothing to run.' \
              >> "$GITHUB_STEP_SUMMARY"
            echo 'No bats tests found under tests/; nothing to run.'
          fi

      - name: 'Install bats'
        if: steps.detect.outputs.found == 'true'
        # yamllint disable-line rule:line-length
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43  # 4.0.0
        with:
          # Only the bats binary is needed today. The helper libraries are
          # unused, so installing them is wasted runner time.
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: 'Run bats tests'
        if: steps.detect.outputs.found == 'true'
        env:
          BATS_TEST_DIR: 'tests/'
        run: |
          # The suite is mock-driven and every test keeps its fixtures in
          # its own BATS_TEST_TMPDIR, so nothing in it shares state with
          # anything else and it runs in parallel. Measured at 9m57s
          # serial against 4m01s at --jobs 4, with the same 860 tests
          # passing either way.
          #
          # bats parallelises through GNU parallel, which the runner image
          # ships. A future image that drops it should slow this job down,
          # not fail it.
          if command -v parallel >/dev/null 2>&1; then
            bats --recursive --jobs "$(nproc)" \
              --print-output-on-failure "${BATS_TEST_DIR}"
          else
            bats --recursive --print-output-on-failure "${BATS_TEST_DIR}"
          fi
