# Dependabot version updates. This repository is pure shell, so the only
# dependency surfaces are the pinned GitHub Actions in .github/workflows
# and the hook revisions in .pre-commit-config.yaml.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Chore"
    open-pull-requests-limit: 15
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "Chore"
    open-pull-requests-limit: 15
    groups:
      pre-commit-hooks:
        patterns:
          - "*"
